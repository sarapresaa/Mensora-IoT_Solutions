<div *ngIf="open" class="tutorial-overlay">
  <div class="tutorial-card">
    <div class="tutorial-header">
      <div>
        <h3>{{ translate.t('addScenario') }}</h3>
        <p class="tutorial-description">{{ translate.t('createNewScenario') }}</p>
      </div>
    </div>
    <div class="tutorial-footer">
      <div style="width:100%">
        <label>{{ translate.t('scenario') }}</label>
        <input type="text" style="width:100%;padding:8px;margin:6px 0;border-radius:8px;" (input)="nameChange.emit($any($event.target).value)" />
        <label>{{ translate.t('devices') }}</label>
        <div style="max-height:200px;overflow:auto;">
          <div *ngIf="availableDevices.length === 0" style="padding:12px;text-align:center;">
            {{ translate.t('noDeviceAvailable') }}
          </div>
          <div *ngFor="let device of availableDevices" style="display:flex;align-items:center;padding:6px;">
            <input type="checkbox" [checked]="selectedDeviceIds.includes(device.device_id)" (change)="toggleDevice.emit(device.device_id)" />
            <label style="margin-left:8px;flex:1;cursor:pointer;" (click)="toggleDevice.emit(device.device_id)">{{ device.device_name }}</label>
          </div>
        </div>
      </div>
      <div class="tutorial-actions">
        <button class="ghost" type="button" (click)="close.emit()">{{ translate.t('cancel') }}</button>
        <button class="primary" type="button" (click)="create.emit()" [disabled]="availableDevices.length === 0" [style.opacity]="availableDevices.length === 0 ? '0.5' : '1'" [style.cursor]="availableDevices.length === 0 ? 'not-allowed' : 'pointer'">{{ translate.t('create') }}</button>
      </div>
    </div>
  </div>
</div>
