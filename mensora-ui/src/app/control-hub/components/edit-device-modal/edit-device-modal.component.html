<ng-container *ngIf="open">
  <div class="tutorial-overlay">
    <div class="tutorial-card">
      <div class="tutorial-header">
        <div>
          <h3>{{ translate.t('editDevice') }}</h3>
        </div>
      </div>

      <div class="tutorial-footer">
        <div style="width:100%">
          <label>{{ translate.t('name') }}</label>
          <input type="text" [value]="name" (input)="nameChange.emit($any($event.target).value)" />

          <label>{{ translate.t('description') }}</label>
          <input type="text" [value]="description" (input)="descriptionChange.emit($any($event.target).value)" />

          <label>IP ({{ translate.t('readOnly') }})</label>
          <input type="text" [value]="ip" readonly />
        </div>

        <div class="tutorial-actions">
          <button class="ghost" type="button" (click)="close.emit()">{{ translate.t('cancel') }}</button>
          <button class="primary" type="button" (click)="save.emit()">{{ translate.t('save') }}</button>
        </div>
      </div>
    </div>
  </div>
</ng-container>
