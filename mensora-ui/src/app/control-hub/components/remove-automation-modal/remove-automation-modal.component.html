<div *ngIf="open" class="tutorial-overlay">
  <div class="tutorial-card">
    <div class="tutorial-header">
      <div>
        <h3>{{ translate.t('remove') }} {{ translate.t('automations') }}</h3>
        <p class="tutorial-description">
          {{ translate.t('okRemove') }}
          {{ count === 1 ? translate.t('thisAutomation') : translate.t('these') + ' ' + count + ' ' + translate.t('automations').toLowerCase() }}?
        </p>
      </div>
    </div>
    <div class="tutorial-footer">
      <div class="tutorial-actions">
        <button class="ghost" type="button" (click)="close.emit()">{{ translate.t('cancel') }}</button>
        <button type="button" (click)="confirm.emit()" style="background-color: red !important; color: white !important; border: 1px solid red !important; border-radius: 12px; padding: 10px 14px; cursor: pointer; font-weight: 600; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);">{{ translate.t('remove') }}</button>
      </div>
    </div>
  </div>
</div>
