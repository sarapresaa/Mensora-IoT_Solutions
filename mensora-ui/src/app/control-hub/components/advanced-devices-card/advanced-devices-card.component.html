<div class="card devices-card-fixed-height">
  <div class="card-header">
    <p class="eyebrow">{{ translate.t('deviceManagement') }}</p>
    <button class="secondary rgb-hover" type="button" (click)="openAdd.emit()">{{ translate.t('add') }}</button>
  </div>
  <div class="stack">
    <div
      *ngFor="let device of devices"
      class="stack-item"
      (click)="selectDevice.emit(device.device_id)"
      [ngClass]="{ 'selected': selectedIds?.has(device.device_id!) }"
    >
      <div style="display:flex;align-items:center;gap:12px;width:100%;">
        <div style="display:flex;flex-direction:column;flex:1;min-width:0;">
          <p class="item-title" style="margin:0">{{ device.name }}</p>
        </div>
        
        <button
          *ngIf="selectedIds && device.device_id && selectedIds.size === 1 && selectedIds.has(device.device_id)"
          class="icon-btn"
          type="button"
          title="{{ translate.t('editDevice') }}"
          (click)="$event.stopPropagation(); openEdit.emit()"
          style="margin-left:4px;vertical-align:middle;padding:6px;border-radius:6px;background:rgba(0,0,0,0.4);flex-shrink:0;"
        >
          <img src="/icons/pencil.svg" alt="Editar" style="width:18px;height:18px;display:inline-block;filter:invert(1);" />
        </button>
      </div>
      <div>
        <div
          class="pill"
          role="button"
          tabindex="0"
          [ngClass]="{ 'pill-on': device.state === 'on', 'pill-off': device.state === 'off' }"
          (click)="toggleDevice.emit(device.device_id); $event.stopPropagation()"
          (keydown.enter)="toggleDevice.emit(device.device_id); $event.stopPropagation()"
        >
          {{ device.state === 'on' ? translate.t('on') : translate.t('off') }}
        </div>
      </div>
    </div>
    <div *ngIf="devices.length === 0" class="stack-item">
      {{ translate.t('noAvailableDevices') || 'Nenhum dispositivo disponível' }}
    </div>
  </div>
  <div class="card-footer">
    
    <button class="secondary" *ngIf="selectedIds && selectedIds.size > 0" type="button" (click)="openRemove.emit()">
      {{ translate.t('remove') }} {{ selectedIds && selectedIds.size > 1 ? ' (' + selectedIds.size + ')' : '' }}
    </button>
  </div>
</div>
